name: Deploy LMS (manual)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lms-production-deployment
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Verify successful main CI
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request
          url=f"https://api.github.com/repos/{os.environ['REPO']}/actions/workflows/ci.yml/runs?head_sha={os.environ['SHA']}&per_page=20"
          req=urllib.request.Request(url,headers={"Authorization":"Bearer "+os.environ["GH_TOKEN"],"Accept":"application/vnd.github+json"})
          with urllib.request.urlopen(req,timeout=20) as response: runs=json.load(response)["workflow_runs"]
          if not any(r["event"]=="push" and r["head_branch"]=="main" and r["head_sha"]==os.environ["SHA"] and r["conclusion"]=="success" for r in runs):
              raise SystemExit("No successful main push CI for this commit")
          PY
      - name: Configure trusted SSH
        env:
          KEY: ${{ secrets.LMS_DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.LMS_DEPLOY_KNOWN_HOSTS }}
        run: |
          test -n "$KEY" && test -n "$KNOWN_HOSTS"
          mkdir -p -m 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
      - name: Deploy on approved VDS
        env:
          HOST: ${{ secrets.LMS_DEPLOY_HOST }}
          USER: ${{ secrets.LMS_DEPLOY_USER }}
          SHA: ${{ github.sha }}
        run: |
          test -n "$HOST" && test -n "$USER"
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15 "$USER@$HOST" "sudo -n bash -s -- '$SHA'" < deploy/approved-deploy.sh
