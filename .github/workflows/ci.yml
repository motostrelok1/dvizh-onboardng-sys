name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Server and client build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: Build server and client (including PWA)
        run: npm run build
      - name: Check Nginx privacy configuration and actual logs
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq nginx
          python3 deploy/test-nginx-privacy.py

  integration:
    name: PostgreSQL and auth tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: lms_test
          POSTGRES_PASSWORD: ci_test_only
          POSTGRES_DB: lms_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lms_test -d lms_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: test
      DATABASE_URL: postgres://lms_test:ci_test_only@127.0.0.1:5432/lms_test
      TEST_DATABASE_URL: postgres://lms_test:ci_test_only@127.0.0.1:5432/lms_test
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: Apply all migrations to the disposable database
        run: npm run migrate --workspace server
      - name: Check migrations can run again
        run: npm run migrate --workspace server
      - name: Run integration tests
        run: npm test
