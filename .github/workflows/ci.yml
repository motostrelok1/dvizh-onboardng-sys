name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Never interrupt a production rollout because another commit was pushed.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Server and client build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: Validate approved deployment shell syntax and guardrails
        run: |
          bash -n deploy/approved-deploy.sh
          python3 deploy/test-approved-deploy.py -v
          sudo python3 deploy/test-approved-runtime.py -v
      - name: Build server and client (including PWA)
        run: npm run build
      - name: Check Nginx privacy configuration and actual logs
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq nginx
          python3 deploy/test-nginx-privacy.py

  integration:
    name: PostgreSQL and auth tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: lms_test
          POSTGRES_PASSWORD: ci_test_only
          POSTGRES_DB: lms_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lms_test -d lms_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: test
      DATABASE_URL: postgres://lms_test:ci_test_only@127.0.0.1:5432/lms_test
      TEST_DATABASE_URL: postgres://lms_test:ci_test_only@127.0.0.1:5432/lms_test
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: Apply all migrations to the disposable database
        run: npm run migrate --workspace server
      - name: Check migrations can run again
        run: npm run migrate --workspace server
      - name: Check H15 read-only content preflight
        run: npm run check:content-integrity --workspace server
      - name: Check H17 read-only attempt preflight
        run: npm run check:attempt-integrity --workspace server
      - name: Run integration tests
        id: tests
        run: npm run test:ci --workspace server
      - name: Require complete test run and write summary
        if: always() && steps.tests.outcome != 'skipped'
        run: node server/scripts/check-test-results.mjs server/test-results.xml
      - name: Save JUnit report
        if: always() && steps.tests.outcome != 'skipped'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: server-test-results-${{ github.run_attempt }}
          path: server/test-results.xml
          if-no-files-found: error
          retention-days: 7

  production_deploy:
    name: Deploy to production after green CI
    needs: [build, integration]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 25
    concurrency:
      group: lms-production-deployment
      cancel-in-progress: false
    steps:
      - name: Checkout exactly the tested commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Detect migrations and dependencies requiring manual release
        id: release_gate
        env:
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: |
          if git diff --name-only "$BEFORE" "$SHA" | grep -Eq '^(server/migrations/|package-lock.json$|client/package.json$|server/package.json$|package.json$|deploy/lms.service$|deploy/nginx.conf.example$)'; then
            echo "manual_required=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Manual production rollout required. Automatic deploy intentionally skipped."
          else
            echo "manual_required=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Set up verified SSH credentials
        if: steps.release_gate.outputs.manual_required == 'false'
        env:
          KEY: ${{ secrets.LMS_DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.LMS_DEPLOY_KNOWN_HOSTS }}
        run: |
          test -n "$KEY" && test -n "$KNOWN_HOSTS"
          mkdir -p -m 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
      - name: Deploy reviewed commit using root-owned VDS script
        if: steps.release_gate.outputs.manual_required == 'false'
        env:
          HOST: ${{ secrets.LMS_DEPLOY_HOST }}
          USER: ${{ secrets.LMS_DEPLOY_USER }}
          SHA: ${{ github.sha }}
        run: |
          test -n "$HOST" && test -n "$USER"
          test "$USER" = "lms-deploy"
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15 "$USER@$HOST" "sudo -n /usr/local/sbin/lms-approved-deploy '$SHA'"
