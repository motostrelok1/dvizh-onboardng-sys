services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: lms
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in root .env}
      POSTGRES_DB: lms
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - lms_db_data:/var/lib/postgresql/data

volumes:
  lms_db_data:
